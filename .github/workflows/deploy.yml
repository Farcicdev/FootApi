name: Deploy Umbrel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name : Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.UMBREL_HOST}}
          username: ${{secrets.UMBREL_USER}}
          key: ${{secrets.SSH_KEY}}
          script: |
            cd ~/apps/FootApi
            git pull
            sudo -n docker compose up -d --build